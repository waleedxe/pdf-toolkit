[package]
name = "pdf-toolkit"
description = "Local-first, offline PDF desktop toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pdf_toolkit_lib"
# Desktop-only application: an rlib for the binary entry point. The mobile-only
# `staticlib`/`cdylib` targets are omitted because they break the Windows
# GNU cross-linker (huge auto-export ordinal) and are not needed for the MVP.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"

pdf-core = { path = "../crates/pdf-core" }
pdf-render = { path = "../crates/pdf-render" }
pdf-service = { path = "../crates/pdf-service" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[features]
# Used by Tauri for production builds without a dev server.
custom-protocol = ["tauri/custom-protocol"]
