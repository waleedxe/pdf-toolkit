name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Regenerate the full icon set from the source image before building.
      - run: node scripts/generate-icon.mjs
      - run: npm run tauri icon assets/icon-source.png

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build

      # A portable build: just the .exe plus the WebView2 loader if one was
      # produced. No installation step required. (In a Cargo workspace the
      # output lives under the workspace-root `target/`, not `src-tauri/target/`.)
      - name: Assemble portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/pdf-toolkit.exe portable/
          if (Test-Path target/release/WebView2Loader.dll) {
            Copy-Item target/release/WebView2Loader.dll portable/
          }
          Compress-Archive -Path portable/* -DestinationPath PDF-Toolkit-portable-windows-x64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            PDF-Toolkit-portable-windows-x64.zip
